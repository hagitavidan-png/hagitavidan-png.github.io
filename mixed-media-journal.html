function meetingTabs(){return active===1?[['introduction','לפני שמתחילים'],...tabs]:tabs}

function renderPanel(){const l=lessons[active-1];if(!l)return;document.querySelectorAll('[role=tab]').forEach(b=>{const yes=b.dataset.tab===tab;b.setAttribute('aria-selected',yes);b.tabIndex=yes?0:-1});const p=$('#panel');p.setAttribute('aria-labelledby','tab-'+tab);p.innerHTML=tab==='introduction'?firstIntroduction():tab==='techniques'?l.techniques.map((t,i)=>`<div class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><p>${esc(t)}</p></div>`).join(''):tab==='artists'?`<div class="artists">${l.artists.map(a=>`<article class="artist"><h2>${esc(a.name)}</h2><p>${esc(a.text)}</p><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(a.query)}" target="_blank" rel="noopener noreferrer">חיפוש תמונות של היצירות ↗</a></article>`).join('')}</div><p class="hint">האמנים וכיווני החיפוש מתוך המצגת. הקישורים נפתחים בחלון חדש.</p>`:`<p class="hint">אפשר לסמן את החומרים שכבר מוכנים למפגש.</p><div class="materials">${l.materials.map((m,i)=>`<label class="material"><input type="checkbox" data-material="${active}-${i}" ${checked.has(active+'-'+i)?'checked':''}><span>${esc(m)}</span></label>`).join('')}</div>`;}
function render(){document.querySelectorAll('[data-lesson]').forEach(b=>b.setAttribute('aria-current',+b.dataset.lesson===active?'page':'false'));$('#lesson-select').value=active;$('#counter').textContent=active?'מפגש '+active+' מתוך 13':'על הסדנה';$('#prev').disabled=!active;$('#next').disabled=active===13;$('#next').textContent=active?'המפגש הבא ←':'למפגש הראשון ←';if(!active){$('#page').innerHTML=overview();return}const l=lessons[active-1];$('#page').innerHTML=`<div class="eyebrow">מפגש ${String(active).padStart(2,'0')} · מיקס מדיה ויומן ויזואלי</div><h1>${esc(l.title)}</h1><p class="intro">${esc(l.intro)}</p><div class="tabs" role="tablist" aria-label="תוכן המפגש">${meetingTabs().map(([id,t])=>`<button type="button" role="tab" id="tab-${id}" aria-controls="panel" data-tab="${id}">${t}</button>`).join('')}</div><section class="panel" id="panel" role="tabpanel" tabindex="0"></section>`;renderPanel();}
function go(n){if(n<0||n>13)return;location.hash=n?'meeting-'+n:'overview'}
function readHash(){const m=location.hash.match(/^#meeting-(\d+)$/);active=m?Math.min(13,Math.max(0,+m[1])):0;tab=active===1?'introduction':'techniques';render();window.scrollTo(0,0)}
$('#lesson-nav').addEventListener('click',e=>{const b=e.target.closest('[data-lesson]');if(b)go(+b.dataset.lesson)});$('#lesson-select').addEventListener('change',e=>go(+e.target.value));$('#prev').onclick=()=>go(active-1);$('#next').onclick=()=>go(active+1);
$('#page').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;renderPanel();$('#tab-'+tab).focus()}});
$('#page').addEventListener('change',e=>{if(e.target.matches('[data-material]')){const k=e.target.dataset.material;e.target.checked?checked.add(k):checked.delete(k)}});
$('#page').addEventListener('keydown',e=>{if(!e.target.matches('[role=tab]'))return;const availableTabs=meetingTabs();const i=availableTabs.findIndex(t=>t[0]===tab);let j;if(e.key==='ArrowLeft')j=(i+1)%availableTabs.length;else if(e.key==='ArrowRight')j=(i+availableTabs.length-1)%availableTabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=availableTabs.length-1;else return;e.preventDefault();tab=availableTabs[j][0];renderPanel();$('#tab-'+tab).focus()});window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
