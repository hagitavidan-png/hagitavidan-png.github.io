function abstractionOverview(){return `<section class="overview-lead"><div class="eyebrow">סדנה שנתית למבוגרים · 13 מפגשים · שעה וחצי</div><h1>מהתבוננות למופשט</h1></section><h2>מה זה מופשט — ומה הוא לא</h2><div class="duo">

<details open><summary>ארבע הפעולות של כל השנה</summary><div class="duo"><section class="principle"><h3>בחירה</h3><p>מה מתוך כל מה שרואים בכלל נכנס לדף</p></section><section class="principle"><h3>הפחתה</h3><p>להוריד עד שנשאר רק מה שמחזיק את העבודה</p></section><section class="principle"><h3>הגדלה וחיתוך</h3><p>לשנות קנה מידה עד שהאובייקט מפסיק להיות אובייקט</p></section><section class="principle"><h3>חזרה</h3><p>לעשות את אותו דבר שוב עד שהוא הופך לשפה</p></section></div></details>
<details><summary>מה נעשה השנה</summary><ol class="year-topics">${abstractionLessons.map((l,i)=>`<li><a href="#abstraction-meeting-${i+1}">${esc(l.title)}</a></li>`).join('')}</ol></details>

const collageArtists=[
{name:'ברק ופיקאסו',text:'פאפייה קולה, 1912 — נייר עיתון ופחם. ההתחלה של הכול.',query:'Braque Picasso papier colle'},
{name:'קורט שוויטרס',text:'Merz — כרטיסים וקבלות שהופכים לקומפוזיציה מדויקת.',query:'Kurt Schwitters Merz'},
{name:'האנה הך',text:'פוטומונטאז׳ דאדא: גוף, מכונה ומגזין באותו דימוי.',query:'Hannah Hoch photomontage'},
{name:'אנרי מאטיס',text:'הגזירים — ״לצייר במספריים״, צבע וצורה בלי מכחול.',query:'Matisse cut-outs'},
{name:'רומייר בירדן',text:'קולאז׳ נרטיבי: חיים שלמים מפיסות מגזין וצילום.',query:'Romare Bearden collage'},

function collageOverview(){return `<section class="overview-lead"><div class="eyebrow">סדנה שנתית למבוגרים · 13 מפגשים · שעה וחצי</div><h1>קולאז׳</h1></section>
<h2>מה זה קולאז׳ — ומה הוא לא</h2><div class="duo">
<section class="principle"><h3>זו לא הדבקה של יפה על יפה</h3><p>קולאז׳ טוב נשען על מתח: בין דימויים, בין קנה מידה, בין חדש לישן</p></section>
<section class="principle"><h3>החומר מגיע עם עבר</h3><p>לקרע מעיתון ישן יש טעם שאי אפשר לצייר. זה היתרון של המדיום</p></section>
<section class="principle"><h3>המספריים הם כלי רישום</h3><p>לחתוך צורה זה לצייר אותה, רק בלי עיפרון</p></section>
<section class="principle"><h3>המשמעות נוצרת בין הפריטים</h3><p>לא בתוך אף אחד מהם בנפרד</p></section></div>
<section class="collage-rule"><h2>כלל הברזל של הסדנה</h2><h3>לא מדביקים בשלב הראשון.</h3><p>מסדרים · מצלמים בטלפון · מזיזים · מצלמים שוב — ורק אז דבק.</p><p>רוב הקולאז׳ים הכושלים נדבקו מוקדם מדי.</p></section>
<details><summary>מאה שנה בשלוש דקות</summary><ol class="collage-history">
<li><b>1912</b><span>פיקאסו וברק מדביקים נייר לתוך ציור. נולד הפאפייה קולה</span></li>
<li><b>שנות ה־20</b><span>דאדא הופכים את הפוטומונטאז׳ לכלי פוליטי חד</span></li>
<li><b>שנות ה־50–60</b><span>דה־קולאז׳, אסמבלאז׳, ורומייר בירדן מספר סיפור שלם בפיסות</span></li>
<li><b>היום</b><span>המדיום הכי נגיש שיש — וגם אחד הרציניים</span></li></ol></details>
<details><summary>אמנים להשראה</summary><div class="artists overview-artists">${collageArtists.map(a=>`<article class="artist"><h3>${esc(a.name)}</h3><p>${esc(a.text)}</p><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(a.query)}" target="_blank" rel="noopener noreferrer">חיפוש תמונות של היצירות ↗</a></article>`).join('')}</div></details>
<details open><summary>ארבע הפעולות של כל השנה</summary><div class="duo">
<section class="principle"><h3>בחירה</h3><p>מה נכנס ומה נשאר בערימה — זה 80% מהעבודה</p></section>
<section class="principle"><h3>קצה</h3><p>חיתוך חד מול קריעה פרועה. הקצה קובע את הטון</p></section>
<section class="principle"><h3>סמיכות</h3><p>מה מונח ליד מה. שני שכנים יוצרים משמעות שלישית</p></section>
<section class="principle"><h3>שכבה</h3><p>מה מכסה את מה, ומה עדיין נראה מבעד</p></section></div></details>
<details><summary>מה נעשה השנה</summary><ol class="year-topics">${collageLessons.map((l,i)=>`<li><a href="#collage-meeting-${i+1}">${esc(l.title)}</a></li>`).join('')}</ol></details>
<details><summary>ארבע שאלות שחוזרות בכל פריסה</summary><ul><li>מה נוצר בין שני הפריטים — משהו שאין באף אחד מהם לחוד?</li><li>הקצוות מספרים את אותו סיפור כמו הדימויים?</li><li>אם מורידים אלמנט אחד — העבודה נחלשת או מתחזקת?</li><li>זה עדיין עובד כשמסתכלים מ־3 מטר?</li></ul></details>`}

function overview(){return workshop==='collage'?collageOverview():workshop==='abstraction'?abstractionOverview():journalOverview()}

function meetingTabs(){if(workshop==='journal')return active===1?[['introduction','לפני שמתחילים'],...tabs]:tabs;const result=[['techniques','מהלך המפגש'],['artists','השראה'],['materials','חומרים']];return workshop==='abstraction'&&active===2?[['values','ערכים וטונים'],...result]:result}

function renderPanel(){const l=lessons[active-1];if(!l)return;document.querySelectorAll('[role=tab]').forEach(b=>{const yes=b.dataset.tab===tab;b.setAttribute('aria-selected',yes);b.tabIndex=yes?0:-1});const p=$('#panel');p.setAttribute('aria-labelledby','tab-'+tab);p.innerHTML=tab==='values'?valuesExplanation():tab==='introduction'?firstIntroduction():tab==='techniques'?l.techniques.map((t,i)=>`<div class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><p>${esc(t)}</p></div>`).join(''):tab==='artists'?`<div class="artists">${l.artists.map(a=>`<article class="artist"><h2>${esc(a.name)}</h2><p>${esc(a.text)}</p><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(a.query)}" target="_blank" rel="noopener noreferrer">חיפוש תמונות של היצירות ↗</a></article>`).join('')}</div><p class="hint">האמנים וכיווני החיפוש מתוך המצגת. הקישורים נפתחים בחלון חדש.</p>`:`<p class="hint">אפשר לסמן את החומרים שכבר מוכנים למפגש.</p><div class="materials">${l.materials.map((m,i)=>`<label class="material"><input type="checkbox" data-material="${workshop}-${active}-${i}" ${checked.has(workshop+'-'+active+'-'+i)?'checked':''}><span>${esc(m)}</span></label>`).join('')}</div>`;}
function render(){renderLessonNav();$('aside h2').textContent=workshopTitles[workshop];$('.footer').textContent='חגית אבידן · בית רוזן · '+workshopTitles[workshop];document.title=workshopTitles[workshop]+' | חגית אבידן';document.body.dataset.workshop=workshop;document.querySelectorAll('[data-workshop]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.workshop===workshop));document.querySelectorAll('[data-lesson]').forEach(b=>b.setAttribute('aria-current',+b.dataset.lesson===active?'page':'false'));$('#lesson-select').value=active;$('#counter').textContent=active?'מפגש '+active+' מתוך 13':'על הסדנה';$('#prev').disabled=!active;$('#next').disabled=active===13;$('#next').textContent=active?'המפגש הבא ←':'למפגש הראשון ←';if(!active){$('#page').innerHTML=overview();return}const l=lessons[active-1];$('#page').innerHTML=`<div class="eyebrow">מפגש ${String(active).padStart(2,'0')} · ${esc(workshopTitles[workshop])}</div><h1>${esc(l.title)}</h1><p class="intro">${esc(l.intro)}</p><div class="tabs" role="tablist" aria-label="תוכן המפגש">${meetingTabs().map(([id,t])=>`<button type="button" role="tab" id="tab-${id}" aria-controls="panel" data-tab="${id}">${t}</button>`).join('')}</div><section class="panel" id="panel" role="tabpanel" tabindex="0"></section>`;renderPanel();}
function go(n){if(n<0||n>13)return;location.hash=workshop==='journal'?(n?'meeting-'+n:'overview'):(n?workshop+'-meeting-'+n:workshop)}
function readHash(){if(location.hash==='#content')return;const m=location.hash.match(/^#((?:abstraction|collage)-)?meeting-(\d+)$/);workshop=location.hash.startsWith('#collage')?'collage':location.hash.startsWith('#abstraction')?'abstraction':'journal';lessons=workshop==='collage'?collageLessons:workshop==='abstraction'?abstractionLessons:journalLessons;active=m?Math.min(13,Math.max(0,+m[2])):0;tab=workshop==='journal'&&active===1?'introduction':workshop==='abstraction'&&active===2?'values':'techniques';render();window.scrollTo(0,0)}
document.querySelector('.workshop-switch').addEventListener('click',e=>{const b=e.target.closest('[data-workshop]');if(b)location.hash=b.dataset.workshop==='journal'?'overview':b.dataset.workshop});

$('#lesson-nav').addEventListener('click',e=>{const b=e.target.closest('[data-lesson]');if(b)go(+b.dataset.lesson)});$('#lesson-select').addEventListener('change',e=>go(+e.target.value));$('#prev').onclick=()=>go(active-1);$('#next').onclick=()=>go(active+1);
$('#page').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;renderPanel();$('#tab-'+tab).focus()}});
$('#page').addEventListener('change',e=>{if(e.target.matches('[data-material]')){const k=e.target.dataset.material;e.target.checked?checked.add(k):checked.delete(k)}});
$('#page').addEventListener('keydown',e=>{if(!e.target.matches('[role=tab]'))return;const availableTabs=meetingTabs();const i=availableTabs.findIndex(t=>t[0]===tab);let j;if(e.key==='ArrowLeft')j=(i+1)%availableTabs.length;else if(e.key==='ArrowRight')j=(i+availableTabs.length-1)%availableTabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=availableTabs.length-1;else return;e.preventDefault();tab=availableTabs[j][0];renderPanel();$('#tab-'+tab).focus()});window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
